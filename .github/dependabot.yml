version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The engine pins MNE and its Python wheels to one Pyodide release
      # (see src/engine/worker.ts), so upgrade Pyodide by hand and run the engine tests.
      - dependency-name: pyodide
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
